<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CSP Challenge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:680px;margin:auto;padding:28px 18px 60px}
.hero{background:#12233f;color:white;border-radius:24px;padding:25px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;opacity:.8}
.card{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 30px #15284a12}
h2{margin-top:0}.field{width:100%;padding:14px;border:1px solid #d8dfeb;border-radius:12px;font-size:16px;margin:6px 0}
button{width:100%;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:700;margin-top:9px;background:#1769e0;color:white}
button.secondary{background:#eaf1fb;color:#164f9e}button.answer{background:#f1f5fa;color:#172033;text-align:left;border:1px solid #dce4ef}
button:disabled{opacity:.55}.hidden{display:none}.top{display:flex;gap:10px;justify-content:space-between;align-items:center}.pill{background:#eaf1fb;padding:7px 10px;border-radius:999px;font-size:13px}
.feedback{padding:13px;border-radius:12px;margin-top:12px;background:#eef3f8}.ok{background:#e7f7ee}.bad{background:#fdecec}
.visual-demo{margin:16px 0;padding:14px;border:1px solid #dce4ef;border-radius:16px;background:#f8fafc}.demo-note{font-size:12px;color:#687386;margin-bottom:10px}.xray{position:relative;aspect-ratio:4/5;max-width:360px;margin:auto;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#88909b 0 18%,#5e6672 19% 42%,#252b34 70%);border:8px solid #111827}.xray:before{content:"";position:absolute;left:49%;top:8%;bottom:7%;width:5px;background:#c9ced5;opacity:.55;border-radius:4px}.xray:after{content:"SCHEMATIC FLUORO";position:absolute;left:10px;bottom:8px;color:#fff;font-size:10px;letter-spacing:1px;opacity:.7}.hotspot{position:absolute;width:48px;height:48px;border:2px solid #fff;border-radius:50%;background:#ffffff22;color:white;font-weight:800;margin:0;padding:0}.hotspot span{position:absolute;left:54px;top:13px;white-space:nowrap;font-size:12px;text-shadow:0 1px 3px #000}.hotspot:disabled{opacity:.8}.hotspot.selected{outline:4px solid #fff}.caseimg{width:100%;display:block;border-radius:12px}.tapimg{position:relative;margin-top:10px;overflow:hidden;border-radius:14px;background:#202630}.tapimg img{width:100%;display:block}.tapmark{position:absolute;width:34px;height:34px;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.tap-hint{font-size:13px;color:#687386;margin:8px 0}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0 20px}.stat-number{font-size:24px;font-weight:800;color:#12233f}.stat-label{font-size:12px;color:#687386}.stat-line{margin:13px 0}.stat-line-head{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}.stat-track{height:10px;border-radius:20px;background:#e8edf4;overflow:hidden}.stat-fill{height:100%;border-radius:20px;background:#55988b}.stat-fill.mid{background:#d7a44d}.stat-fill.high{background:#c76c54}.stat-note{font-size:12px;color:#687386;margin-top:14px}table{width:100%;border-collapse:collapse}td,th{padding:10px 5px;border-bottom:1px solid #edf0f5;text-align:left}.small{font-size:13px;color:#687386}
</style>
</head>
<body><main class="wrap">
<section class="hero"><h1>CSP Challenge</h1><p>3 questions. Build your score. Climb the leaderboard.</p></section>

<section id="auth" class="card">
<h2>Player Login</h2>
<input id="name" class="field" placeholder="Player name">
<select id="country" class="field"><option value="">Select country</option>
<option>Algeria</option><option>Austria</option><option>Azerbaijan</option><option>Bahrain</option><option>Belgium</option><option>Croatia</option><option>Egypt</option><option>Germany</option><option>Iran</option><option>Israel</option><option>Jordan</option><option>Kazakhstan</option><option>Kuwait</option><option>Lebanon</option><option>Morocco</option><option>Oman</option><option>Poland</option><option>Qatar</option><option>Saudi Arabia</option><option>Serbia</option><option>Slovakia</option><option>Slovenia</option><option>South Africa</option><option>Switzerland</option><option>Tunisia</option><option>Turkey</option><option>United Arab Emirates</option><option>Other</option>
</select>
<input id="email" class="field" type="email" placeholder="Email">
<input id="password" class="field" type="password" placeholder="Password">
<button id="login">Log in</button>
<button id="signup" class="secondary">Create account</button>
<p id="authmsg" class="small"></p>
</section>

<section id="home" class="card hidden">
<div class="top"><div><h2 style="margin:0">Ready?</h2><div id="who" class="small"></div></div><span class="pill">3 questions</span></div>
<button id="start">Start Challenge</button>
<button id="showboard" class="secondary">Leaderboard</button>
<button id="logout" class="secondary">Log out</button>
</section>

<section id="game" class="card hidden">
<div class="top"><span id="progress" class="pill"></span><span id="score" class="pill">0 pts</span></div>
<h2 id="question" style="margin-top:18px"></h2>
<div id="visual" class="visual-demo hidden"></div><div id="answers"></div><div id="feedback" class="feedback hidden"></div>
<button id="next" class="hidden">Next</button>
</section>

<section id="result" class="card hidden"><h2>Round complete</h2><p id="resulttext"></p>
<button id="again">Play another round</button><button id="resultboard" class="secondary">Leaderboard</button><div id="playerstats" style="margin-top:24px" aria-live="polite"></div><div id="learningjourney" style="margin-top:22px" aria-live="polite"></div></section>

<section id="board" class="card hidden"><h2>Leaderboard</h2><div id="boardcontent"></div><button id="back" class="secondary">Back</button></section>
</main>
<script>
const SUPABASE_URL='https://zcwyyifwjtyreevcbvwz.supabase.co';
const SUPABASE_KEY='sb_publishable_GkicTQkKeMzI537TMyux9A_6gU2xy5C';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let questions=[], idx=0, roundId=null, localScore=0, questionStartedAt=0, answering=false;
function view(id){['auth','home','game','result','board'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
async function session(){const {data}=await sb.auth.getSession(); if(data.session){$('who').textContent=data.session.user.email;view('home')}else view('auth')}
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim(),country=$('country').value;if(!country){$('authmsg').textContent='Please select your country.';return}$('authmsg').textContent='Creating account…';const {data,error}=await sb.auth.signUp({email,password,options:{data:{player_name:name||email.split('@')[0],country}}});if(!error&&data.user){const {error:profileError}=await sb.from('profiles').update({country}).eq('id',data.user.id);if(profileError){$('authmsg').textContent='Account created, but country could not be saved: '+profileError.message;return}}$('authmsg').textContent=error?error.message:(data.session?'Account created.':'Account created. You can now log in.');if(data.session)session()}
$('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('authmsg').textContent=error?error.message:'';if(!error)session()}
$('logout').onclick=async()=>{await sb.auth.signOut();session()}
$('start').onclick=async()=>{localScore=0;const {data,error}=await sb.rpc('start_round');if(error){alert(error.message);return}questions=data;idx=0;roundId=data[0]?.round_id;if(!roundId){alert('No questions returned.');return}view('game');render()}
function render(){questionStartedAt=Date.now();answering=false;const q=questions[idx];$('progress').textContent='Question '+(idx+1)+' / 3';$('score').textContent=localScore+' pts';$('question').textContent=q.question;$('feedback').className='feedback hidden';$('next').classList.add('hidden');$('answers').innerHTML='';$('visual').innerHTML='';$('visual').classList.add('hidden');if(q.question_type==='xray_hotspot'){renderVisual(q);return}const a=[['A',q.answer_a],['B',q.answer_b],['C',q.answer_c],['D',q.answer_d]];const box=$('answers');a.forEach(([k,t])=>{const b=document.createElement('button');b.className='answer';b.textContent=k+'. '+t;b.onclick=()=>answer(k);box.appendChild(b)})}
function renderVisual(q){const v=$('visual');v.classList.remove('hidden');if(q.visual_key==='demo_lead_position_1'){v.innerHTML='<div class="demo-note">DEMO CASE — schematic, not clinically validated</div><img class="caseimg" alt="Schematic 12-lead ECG" src="visual-ecg.svg"><div class="tap-hint">Based on the 12-lead ECG, tap the most likely pacing lead location on the fluoroscopy image.</div><div class="tapimg" id="tapimg"><img alt="Schematic fluoroscopy chest image" src="visual-fluoro.svg"></div>';const area=$('tapimg');area.onclick=e=>{if(area.dataset.done)return;area.dataset.done='1';const r=area.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const m=document.createElement('div');m.className='tapmark';m.style.left=(x*100)+'%';m.style.top=(y*100)+'%';area.appendChild(m);const correct=(Math.hypot(x-.53,y-.48)<.16);answer(correct?'B':'A')};return}v.innerHTML='<div class="demo-note">DEMO / SCHEMATIC — tap the most likely lead position</div><div class="xray" id="xray"></div>';const positions={A:[43,20],B:[54,42],C:[35,53],D:[52,73]};const labels={A:q.answer_a,B:q.answer_b,C:q.answer_c,D:q.answer_d};Object.entries(positions).forEach(([k,p])=>{const b=document.createElement('button');b.className='hotspot';b.style.left='calc('+p[0]+'% - 24px)';b.style.top='calc('+p[1]+'% - 24px)';b.textContent=k;b.setAttribute('aria-label',labels[k]);b.onclick=()=>{b.classList.add('selected');answer(k)};$('xray').appendChild(b)})}
async function answer(k){if(answering)return;answering=true;const elapsedMs=Math.max(0,Date.now()-questionStartedAt);[...$('answers').children].forEach(b=>b.disabled=true);document.querySelectorAll('.hotspot').forEach(b=>b.disabled=true);const {data,error}=await sb.rpc('submit_answer',{p_round_id:roundId,p_question_number:questions[idx].question_number,p_answer:k,p_response_ms:elapsedMs});if(error){answering=false;[...$('answers').children].forEach(b=>b.disabled=false);document.querySelectorAll('.hotspot').forEach(b=>b.disabled=false);alert(error.message);return}const r=data[0];localScore+=r.points;$('score').textContent=localScore+' pts';$('feedback').className='feedback '+(r.correct?'ok':'bad');$('feedback').innerHTML='<strong>'+(r.correct?'Correct!':'Incorrect')+'</strong><br>'+(r.explanation||'');$('next').textContent=idx===2?'Finish round':'Next';$('next').classList.remove('hidden')}
$('next').onclick=async()=>{if(idx<2){idx++;render();return}const {data,error}=await sb.rpc('finish_round',{p_round_id:roundId});if(error){alert(error.message);return}const r=data[0];$('resulttext').textContent='You scored '+r.score+' points — '+r.correct_answers+' of 3 correct.';view('result');loadPlayerStats();loadLearningJourney()}
async function loadPlayerStats(){
 const target=$('playerstats');target.innerHTML='<h2>Your Learning Progress</h2><p class="small">Loading your personal statistics…</p>';
 const {data,error}=await sb.rpc('get_my_training_stats');
 if(error){target.innerHTML='<h2>Your Learning Progress</h2><p class="small">Statistics are not yet available. The analytics database function needs to be activated.</p>';return}
 const rows=Array.isArray(data)?data:[],total=rows.reduce((a,r)=>a+Number(r.answers||0),0),wrong=rows.reduce((a,r)=>a+Number(r.incorrect||0),0),timed=rows.reduce((a,r)=>a+Number(r.timed_answers||0),0),ms=rows.reduce((a,r)=>a+Number(r.total_response_ms||0),0);
 const pct=total?Math.round((total-wrong)/total*100):0;
 let h='<h2>Your Learning Progress</h2><p class="small">All your answers across completed and ongoing rounds</p><div class="stat-grid"><div><div class="stat-label">Answers</div><div class="stat-number">'+total+'</div></div><div><div class="stat-label">Success rate</div><div class="stat-number">'+pct+'%</div></div><div><div class="stat-label">Avg. response</div><div class="stat-number">'+(timed?(ms/timed/1000).toFixed(1)+' s':'—')+'</div></div></div><h3>Success rate by training area</h3>';
 const sorted=rows.slice().sort((a,b)=>(1-Number(b.incorrect||0)/Math.max(1,Number(b.answers||0)))-(1-Number(a.incorrect||0)/Math.max(1,Number(a.answers||0))));
 for(const r of sorted){const n=Number(r.answers||0),p=n?Math.round((n-Number(r.incorrect||0))/n*100):0;h+='<div class="stat-line"><div class="stat-line-head"><span>'+escapeHtml(r.category)+'</span><span>'+p+'% · '+n+' answers</span></div><div class="stat-track"><div class="stat-fill '+(p<50?'high':p<70?'mid':'')+'" style="width:'+p+'%"></div></div></div>'}
 h+='<p class="stat-note">Based on your answers only. Average time excludes older answers without timing. Small samples and question difficulty can affect success rates.</p>';target.innerHTML=h;
}
async function loadLearningJourney(){
 const target=$('learningjourney');target.innerHTML='<h2>Your Learning Journey</h2><p class="small">Loading activity and progress…</p>';
 const {data,error}=await sb.rpc('get_my_learning_journey');
 if(error){target.innerHTML='<h2>Your Learning Journey</h2><p class="small">Activity and progress will appear after the database update.</p>';return}
 const x=Array.isArray(data)?data[0]:data;
 if(!x){target.innerHTML='<h2>Your Learning Journey</h2><p class="small">Complete a round to begin.</p>';return}
 const n=v=>Number(v||0),activity=Math.max(0,Math.min(100,n(x.activity_score))),progress=x.progress_pp==null?null:n(x.progress_pp);
 const progressText=progress==null?'Building your baseline':(progress>0?'+':'')+progress.toFixed(1)+' pp';
 target.innerHTML='<h2>Your Learning Journey</h2><div class="stat-grid"><div><div class="stat-label">Completed rounds</div><div class="stat-number">'+n(x.rounds_completed)+'</div></div><div><div class="stat-label">Active days (30d)</div><div class="stat-number">'+n(x.active_days_30d)+'</div></div><div><div class="stat-label">Current streak</div><div class="stat-number">'+n(x.current_streak)+'d</div></div></div><div class="stat-line-head"><strong>Learning Activity</strong><strong>'+activity+'/100</strong></div><div class="stat-track"><div class="stat-fill" style="width:'+activity+'%"></div></div><div class="stat-line" style="margin-top:18px"><div class="stat-line-head"><strong>Knowledge Score</strong><strong>'+n(x.knowledge_score).toFixed(1)+'%</strong></div></div><div class="stat-line-head"><strong>Learning Progress</strong><strong>'+progressText+'</strong></div><p class="stat-note">Activity uses the last 30 days. Progress compares your last 10 completed rounds with the previous 10; at least 20 rounds are required. pp = percentage points.</p>';
}
async function board(){view('board');$('boardcontent').textContent='Loading…';const {data,error}=await sb.rpc('get_leaderboard');if(error){$('boardcontent').textContent=error.message;return}let h='<table><tr><th>#</th><th>Player</th><th>Country</th><th>Score</th></tr>';data.slice(0,50).forEach((r,i)=>h+='<tr><td>'+(i+1)+'</td><td>'+escapeHtml(r.player_name)+'</td><td>'+countryLabel(r.country)+'</td><td>'+r.total_score+'</td></tr>');$('boardcontent').innerHTML=h+'</table>'}
function countryLabel(s){if(!s)return '—';const codes={'Germany':'DE','United Arab Emirates':'AE','Belgium':'BE','Saudi Arabia':'SA','Switzerland':'CH','Austria':'AT','Turkey':'TR','Serbia':'RS','Croatia':'HR','Poland':'PL','Algeria':'DZ','Morocco':'MA','Tunisia':'TN','Egypt':'EG','Iran':'IR','Israel':'IL','Jordan':'JO','Lebanon':'LB','Kuwait':'KW','Bahrain':'BH','Oman':'OM','Qatar':'QA','Azerbaijan':'AZ','Kazakhstan':'KZ','Slovakia':'SK','Slovenia':'SI','South Africa':'ZA'};const code=codes[s];const flag=code?String.fromCodePoint(...[...code].map(x=>127397+x.charCodeAt(0)))+' ':'';return flag+escapeHtml(s)}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'Player';return d.innerHTML}
$('showboard').onclick=board;$('resultboard').onclick=board;$('back').onclick=()=>view('home');$('again').onclick=()=>$('start').click();
sb.auth.onAuthStateChange(()=>session());session();
</script></body></html>

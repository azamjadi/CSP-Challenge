<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSP Challenge | Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font:16px system-ui;background:#f3f6fb;color:#172b47;max-width:950px;margin:0 auto;padding:20px}header{background:#12233f;color:white;padding:22px;border-radius:16px}header a{color:#cbe2ff}.panel{background:white;padding:20px;margin:16px 0;border-radius:14px;box-shadow:0 4px 18px #1232}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #cbd5e1}input{width:90%;max-width:420px}button{background:#1769e0;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.hidden{display:none}.row{border-top:1px solid #ddd;padding:15px 0}.muted{color:#64748b;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#9d3440}.stats{display:flex;gap:15px;flex-wrap:wrap}</style></head>
<body><header><h1>Super Admin Dashboard</h1><p>Manage CSP Challenge users</p><a href="./">← Player Dashboard</a></header>
<div id="adminloading" class="panel"><h2>Checking administrator access…</h2><p id="adminloadingmessage">Please wait while your session is verified.</p><p><a href="./">Return to Player Dashboard</a></p></div>
<div id="dashboard" class="hidden"><div class="panel"><h2>User Management</h2><p id="message" class="muted"></p><div class="stats"><strong id="total"></strong><strong id="pending"></strong><strong id="active"></strong></div><p><button id="reload">Refresh</button> <button id="signout">Sign out</button></p></div><div class="panel"><div class="filters"><input id="search" placeholder="Search name, email, country"><select id="status"><option value="">All statuses</option><option>pending</option><option>active</option><option>rejected</option><option>suspended</option></select><select id="country"><option value="">All countries</option></select></div><p id="count" class="muted"></p><div id="users"></div></div></div>
<script src="admin.js?v=20261010-2"></script></body></html>
